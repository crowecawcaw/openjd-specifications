name: Conformance Tests (Windows)

on:
  push:
    branches: [ windows-ci-test ]
  pull_request:
    branches: [ mainline ]
    paths:
      - conformance-tests/**
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install openjd-cli pyyaml

    - name: Run conformance tests
      working-directory: conformance-tests
      run: python run_openjd_cli_tests.py
